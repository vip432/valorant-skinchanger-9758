<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="metalSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8E6E1"/>
      <stop offset="35%" stop-color="#E8E6E1"/>
      <stop offset="50%" stop-color="#7DF9FF"/>
      <stop offset="65%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#E8E6E1"/>
    </linearGradient>
    <linearGradient id="bladeSheen" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E8E6E1"/>
      <stop offset="40%" stop-color="#7DF9FF"/>
      <stop offset="60%" stop-color="#E8E6E1"/>
      <stop offset="100%" stop-color="#E8E6E1"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4655"/>
      <stop offset="100%" stop-color="#FF4655"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="256" height="256" fill="#0B0E13"/>

  <!-- Fractured hexagonal chamber - outer broken hex -->
  <g transform="translate(128, 128)">
    <!-- Hex top-right fragment -->
    <polygon points="0,-78 62,-44 62,0 0,-34" fill="none" stroke="#E8E6E1" stroke-width="3"/>
    <!-- Hex bottom-right fragment -->
    <polygon points="62,0 62,44 0,78 0,34" fill="none" stroke="#E8E6E1" stroke-width="3"/>
    <!-- Hex bottom-left fragment -->
    <polygon points="0,78 -58,46 -58,4 0,34" fill="none" stroke="#7DF9FF" stroke-width="2.5"/>
    <!-- Hex top-left fragment -->
    <polygon points="-58,-46 0,-78 0,-34 -58,-4" fill="none" stroke="#E8E6E1" stroke-width="3"/>

    <!-- Fracture lines cutting through the hex -->
    <line x1="-58" y1="-46" x2="-15" y2="-10" stroke="#FF4655" stroke-width="2"/>
    <line x1="-15" y1="-10" x2="20" y2="5" stroke="#FF4655" stroke-width="2"/>
    <line x1="20" y1="5" x2="62" y2="44" stroke="#FF4655" stroke-width="1.5"/>
    <line x1="62" y1="-44" x2="30" y2="-15" stroke="#7DF9FF" stroke-width="1.5"/>
    <line x1="30" y1="-15" x2="-5" y2="5" stroke="#7DF9FF" stroke-width="1.5"/>
    <line x1="-5" y1="5" x2="-58" y2="46" stroke="#7DF9FF" stroke-width="1.5"/>

    <!-- Inner chamber detail -->
    <polygon points="0,-48 38,-22 38,22 0,48 -38,22 -38,-22" fill="none" stroke="#E8E6E1" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Tactical knife blade - crossing diagonally through the hex -->
  <g transform="translate(128, 128) rotate(-38)">
    <!-- Main blade shape -->
    <path d="M-8,-130 L14,-130 L20,-90 L18,-40 L14,10 L8,60 L2,95 L-2,95 L-8,60 L-14,10 L-18,-40 L-20,-90 Z" fill="url(#bladeSheen)" stroke="#E8E6E1" stroke-width="2"/>

    <!-- Blade edge highlight -->
    <path d="M8,-130 L16,-90 L14,-40 L10,10 L6,60 L2,95" fill="none" stroke="#7DF9FF" stroke-width="1.5" opacity="0.8"/>

    <!-- Blade spine line -->
    <path d="M-6,-130 L-14,-90 L-16,-40 L-12,10 L-8,60 L-2,95" fill="none" stroke="#E8E6E1" stroke-width="1" opacity="0.6"/>

    <!-- Stencil cutouts on blade -->
    <polygon points="-2,-110 6,-110 8,-95 4,-80 0,-80 -4,-95" fill="#0B0E13"/>
    <polygon points="-2,-60 6,-60 8,-45 4,-30 0,-30 -4,-45" fill="#0B0E13"/>
    <polygon points="-2,-10 6,-10 7,5 4,20 0,20 -4,5" fill="#0B0E13"/>

    <!-- Blade tip accent -->
    <polygon points="-8,-130 14,-130 12,-120 4,-118 -2,-120" fill="#FF4655"/>

    <!-- Guard/crossguard -->
    <polygon points="-30,-40 30,-40 32,-32 -32,-32" fill="#E8E6E1" stroke="#E8E6E1" stroke-width="1"/>
    <polygon points="-28,-38 28,-38 28,-34 -28,-34" fill="#7DF9FF" opacity="0.6"/>

    <!-- Handle -->
    <rect x="-8" y="-32" width="16" height="52" fill="#E8E6E1" stroke="#E8E6E1" stroke-width="1"/>
    <!-- Handle stencil lines -->
    <line x1="-8" y1="-22" x2="8" y2="-22" stroke="#0B0E13" stroke-width="2"/>
    <line x1="-8" y1="-12" x2="8" y2="-12" stroke="#0B0E13" stroke-width="2"/>
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#0B0E13" stroke-width="2"/>
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#0B0E13" stroke-width="2"/>

    <!-- Pommel -->
    <polygon points="-10,20 10,20 12,28 0,36 -12,28" fill="#FF4655" stroke="#E8E6E1" stroke-width="1.5"/>
  </g>

  <!-- Corner angular accents for badge frame -->
  <polygon points="8,8 40,8 8,40" fill="#E8E6E1" opacity="0.15"/>
  <polygon points="248,8 216,8 248,40" fill="#E8E6E1" opacity="0.15"/>
  <polygon points="8,248 40,248 8,216" fill="#E8E6E1" opacity="0.15"/>
  <polygon points="248,248 216,248 248,216" fill="#E8E6E1" opacity="0.15"/>

  <!-- Small angular notch accents -->
  <polygon points="0,0 12,0 0,12" fill="#FF4655" opacity="0.8"/>
  <polygon points="256,0 244,0 256,12" fill="#FF4655" opacity="0.8"/>
  <polygon points="0,256 12,256 0,244" fill="#7DF9FF" opacity="0.6"/>
  <polygon points="256,256 244,256 256,244" fill="#7DF9FF" opacity="0.6"/>

  <!-- Small wordmark -->
  <text x="128" y="240" text-anchor="middle" font-family="monospace" font-size="7" fill="#E8E6E1" opacity="0.5" letter-spacing="3">VALORANT SKINCHANGER</text>
</svg>
